name: Przegląd nowości AI — mailem

on:
  schedule:
    - cron: '0 7 1 * *' # Pierwszy dzień miesiąca, ~08:00 CET
  workflow_dispatch: # Możliwość ręcznego uruchomienia z GitHub UI

jobs:
  generate-brief:
    name: Zbierz nowości i wyślij przegląd
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Przegląd nie trafia już na bloga, tylko na prywatną skrzynkę właściciela,
      # dlatego nie potrzebuje ani sekretu webhooka, ani ImgBB.
      - name: Zbierz nowości i wyślij mailem
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_RECIPIENT_EMAIL: ${{ secrets.BRIEF_RECIPIENT_EMAIL }}
        run: node .github/scripts/blog-brief.mjs
