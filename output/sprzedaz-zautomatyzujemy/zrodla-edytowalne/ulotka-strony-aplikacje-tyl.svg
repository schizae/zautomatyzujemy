<svg xmlns="http://www.w3.org/2000/svg" width="148.0mm" height="210.0mm" viewBox="0 0 419.52755905511816 595.2755905511812"><rect x="-8.503937007874017" y="-8.503937007874017" width="436.5354330708662" height="612.2834645669292" fill="#f5f2ed"/><polygon points="32.480000000000004,25.0 41.44,25.0 41.44,37.88 37.52,37.88 37.52,28.92 32.480000000000004,28.92" fill="#c93820"/><polygon points="28.0,32.28 31.92,32.28 31.92,41.24 36.96,41.24 36.96,45.160000000000004 28.0,45.160000000000004" fill="#c93820"/><text x="50.44" y="39.879999999999995" font-family="Arial" font-size="12" font-weight="700" font-style="normal" fill="#151719">zautomatyzujemy.pl</text><text x="28" y="106.03999999999999" font-family="Arial" font-size="22" font-weight="700" font-style="normal" fill="#151719">Od wejścia na stronę</text><text x="28" y="134.04" font-family="Arial" font-size="22" font-weight="700" font-style="normal" fill="#151719">do konkretnej sprawy.</text><text x="28" y="186.38" font-family="Arial" font-size="9" font-weight="700" font-style="normal" fill="#c93820">01</text><text x="59" y="186.84" font-family="Arial" font-size="12" font-weight="700" font-style="normal" fill="#151719">Strona firmowa</text><text x="59" y="208.364" font-family="Arial" font-size="10.2" font-weight="400" font-style="normal" fill="#151719">Oferta czytelna na telefonie, wygodny kontakt i formularz dopasowany do</text><text x="59" y="222.364" font-family="Arial" font-size="10.2" font-weight="400" font-style="normal" fill="#151719">informacji, których potrzebujesz.</text><text x="28" y="280.38" font-family="Arial" font-size="9" font-weight="700" font-style="normal" fill="#c93820">02</text><text x="59" y="280.84" font-family="Arial" font-size="12" font-weight="700" font-style="normal" fill="#151719">Narzędzie do pracy</text><text x="59" y="302.364" font-family="Arial" font-size="10.2" font-weight="400" font-style="normal" fill="#151719">Panel, rezerwacje lub obsługa zleceń. Najpierw opisujemy jedną ścieżkę i</text><text x="59" y="316.364" font-family="Arial" font-size="10.2" font-weight="400" font-style="normal" fill="#151719">sprawdzamy potrzebne integracje.</text><text x="28" y="374.38" font-family="Arial" font-size="9" font-weight="700" font-style="normal" fill="#c93820">03</text><text x="59" y="374.84" font-family="Arial" font-size="12" font-weight="700" font-style="normal" fill="#151719">Bezpośrednia współpraca</text><text x="59" y="396.364" font-family="Arial" font-size="10.2" font-weight="400" font-style="normal" fill="#151719">Rozmawiasz ze mną od pierwszego spotkania po przekazanie</text><text x="59" y="410.364" font-family="Arial" font-size="10.2" font-weight="400" font-style="normal" fill="#151719">rozwiązania. Zakres i sposób odbioru ustalamy wcześniej.</text><rect x="0" y="469" width="419.52755905511816" height="134.77952755905517" fill="#151719"/><text x="28" y="499.48" font-family="Arial" font-size="14" font-weight="700" font-style="normal" fill="#f5f2ed">Norbert Chojnacki</text><text x="28" y="522.2" font-family="Arial" font-size="10" font-weight="400" font-style="normal" fill="#f5f2ed">+48 730 094 465  |  zautomatyzujemy.pl</text><text x="28" y="542.544" font-family="Arial" font-size="9.2" font-weight="400" font-style="normal" fill="#f5f2ed">n.chojnacki1993@gmail.com</text><text x="28" y="568.232" font-family="Arial" font-size="7.6" font-weight="400" font-style="normal" fill="#dedbd5">Treści, funkcje, harmonogram i utrzymanie określamy przed realizacją.</text></svg>